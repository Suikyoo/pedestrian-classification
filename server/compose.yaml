# Server stack: broker, master service, and dashboard. No host ports are published.
# cloudflared (on the external network cloudflared-net) routes pedestrian-detection.suikyoo.xyz:
#   path /mqtt  ->  http://mosquitto:9001   (devices: wss://pedestrian-detection.suikyoo.xyz:443/mqtt)
#   all else    ->  http://web:8000         (dashboard)
#
#   docker compose up -d --build
#   docker compose exec master python -m master.cli status <mac>

name: pedestrian

x-server: &server
  build: .
  image: pedestrian-master:latest
  restart: unless-stopped
  volumes:
    - events:/data/events

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_USER: ${MQTT_USER:?set MQTT_USER in .env}
      MQTT_PASS: ${MQTT_PASS:?set MQTT_PASS in .env}
      DEVICE_CREDENTIALS: ${DEVICE_CREDENTIALS:?set DEVICE_CREDENTIALS in .env}
    volumes:
      - ./deploy/mosquitto.docker.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto-entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    networks: [internal, cloudflared-net]

  master:
    <<: *server
    command: ["python", "-m", "master.app"]
    stop_signal: SIGINT # master.app shuts down cleanly on KeyboardInterrupt
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:?set MQTT_USER in .env}
      MQTT_PASS: ${MQTT_PASS:?set MQTT_PASS in .env}
      DEVICE: ${DEVICE:-cpu}
      PEDESTRIAN_CONF_THRESHOLD: ${PEDESTRIAN_CONF_THRESHOLD:-0.6}
      INFERENCE_HISTORY: ${INFERENCE_HISTORY:-200}
    depends_on: [mosquitto]
    networks: [internal]

  web:
    <<: *server
    command: ["python", "-m", "master.web"]
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
      PEDESTRIAN_CONF_THRESHOLD: ${PEDESTRIAN_CONF_THRESHOLD:-0.6}
      INFERENCE_HISTORY: ${INFERENCE_HISTORY:-200}
    depends_on: [master]
    networks: [cloudflared-net]

volumes:
  events:
  mosquitto-data:

networks:
  internal:
  cloudflared-net:
    external: true
