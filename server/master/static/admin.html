<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Camera admin · Crossing Study</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <a class="skip-link" href="#admin">Skip to camera controls</a>
  <header class="navigation">
    <div class="wrap navigation__inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="5" fill="currentColor"/><path d="m5 23 8-14h3L8 23zm6 0 8-14h3l-8 14zm6 0 8-14h3l-8 14z" fill="#f6f6f2"/></svg>
        Pedestrian monitor
      </a>
      <nav aria-label="Main navigation"><a href="/">Dashboard</a><a href="/admin" aria-current="page">Camera admin</a></nav>
    </div>
  </header>

  <main class="wrap admin" id="admin" tabindex="-1">
    <header class="admin__heading">
      <h1>Camera admin</h1>
      <p>Send commands and settings to a camera.</p>
    </header>
    <div class="admin__workspace">
      <div class="admin__operations">
        <section class="panel admin__card" aria-labelledby="device-h">
          <h2 id="device-h">Camera</h2>
          <label class="field">
            <span class="field__label">Device</span>
            <select id="device" aria-describedby="device-state"></select>
          </label>
          <p class="admin__state" id="device-state" role="status"></p>
        </section>

        <section class="panel admin__card" aria-labelledby="cmd-h">
          <h2 id="cmd-h">Commands</h2>
          <div class="admin__buttons">
            <button class="button" type="button" data-action="start">Start streaming</button>
            <button class="button" type="button" data-action="stop">Stop streaming</button>
            <button class="button" type="button" data-action="status">Request status</button>
            <button class="button admin__danger" type="button" data-action="reboot"><span class="diamond" aria-hidden="true"></span>Reboot</button>
          </div>
          <div class="admin__alert">
            <label class="field">
              <span class="field__label">Repeats</span>
              <input id="repeat" type="number" min="1" max="10" step="1" value="1" inputmode="numeric">
            </label>
            <button class="button" type="button" id="play-alert">Play alert sound</button>
          </div>
        </section>
      </div>

      <section class="panel admin__card" aria-labelledby="cfg-h">
        <h2 id="cfg-h">Settings</h2>
        <p class="admin__hint" id="cfg-hint"></p>
        <form id="config-form" aria-describedby="cfg-hint" novalidate>
          <div class="admin__grid" id="fields"></div>
          <div class="admin__buttons">
            <button class="button admin__primary" type="submit" id="save">Save changed settings</button>
            <button class="button" type="button" id="reset">Discard edits</button>
          </div>
        </form>
      </section>
    </div>

    <p class="admin__toast" id="toast" role="status" aria-live="polite"></p>
  </main>

  <script src="/static/admin.js"></script>
</body>
</html>
