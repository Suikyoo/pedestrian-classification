# Mosquitto config for compose.yaml. No ports are published on the host: the master
# reaches 1883 on the internal network, and cloudflared reaches 9001 on cloudflared-net.

# Plain MQTT for the master service and CLI
listener 1883

# MQTT over WebSocket, published by cloudflared as wss://pedestrian-classification.suikyoo.xyz/mqtt
listener 9001
protocol websockets

# v1: no authentication. Anyone who knows the public hostname can read images
# and send commands. To enable auth, see server/README.md "Enabling MQTT auth".
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
